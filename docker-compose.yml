version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: weather_app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./backend
    depends_on:
      - postgres
      - redis
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/weather_app?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: changeme-super-secret
      JWT_EXPIRES_IN: 7d
      OPENWEATHER_API_KEY: your-openweather-api-key
      OPENWEATHER_BASE_URL: https://api.openweathermap.org
      OPENWEATHER_TIMEOUT_MS: 8000
      FRONTEND_URL: http://localhost:5173
    ports:
      - "4000:4000"
    command: sh -c "npx prisma db push && npm run seed && npm run dev"
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://localhost:4000/api
    ports:
      - "5173:5173"
    command: npm run dev -- --host 0.0.0.0
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
  redis_data:
